[package]
name = "relay-core"
description = "Hands out tokens and relays Anthropic / OpenAI API requests to configured upstreams with their keys."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
http-body-util = "0.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-native-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
