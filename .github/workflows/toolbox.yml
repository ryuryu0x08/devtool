# Checks the toolbox (apps/toolbox): types, unit tests, the build, and the end-to-end tests in
# Chromium against the build. Then its desktop app (apps/toolbox/desktop) on macOS, Windows and
# Linux: built, the same end-to-end tests run in it, and its installers attached to the run.
# All passed on main: the toolbox-stable branch moves to it (installed apps update from there).
name: toolbox
on:
  push:
    paths: ['apps/toolbox/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/toolbox.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Electron is the desktop app's: not needed here.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/toolbox
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: apps/toolbox/test-results

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm run typecheck -w @devtool/toolbox-desktop
      # The updater (fetching, moving the clone forward, swapping the app): git and bash, not Windows.
      - if: runner.os != 'Windows'
        run: npm test -w @devtool/toolbox-desktop
      # The packager downloads its tools from GitHub's releases, which now and then answer 5xx:
      # tried again, a minute apart.
      - name: Build (the installers, and the app beside them)
        run: |
          for try in 1 2 3; do
            npm run dist -w @devtool/toolbox-desktop && exit 0
            [ "$try" = 3 ] || { echo "build failed (try $try), again in 60 s"; sleep 60; }
          done
          exit 1
      - name: Signed (ad hoc) and intact
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 apps/toolbox/desktop/release/mac-arm64/Toolbox.app
      # As on a Mac: build.sh --install builds, installs and opens it; then again over the running one.
      - name: The build script (macOS)
        if: runner.os == 'macOS'
        run: |
          apps/toolbox/desktop/build.sh --install
          for _ in $(seq 40); do pgrep -f /Applications/Toolbox.app/ >/dev/null && break; sleep 0.5; done
          pgrep -f /Applications/Toolbox.app/ >/dev/null || { echo "the installed app is not running"; exit 1; }
          OLD="$(pgrep -f /Applications/Toolbox.app/Contents/MacOS/Toolbox | head -1)"
          apps/toolbox/desktop/build.sh --install
          for _ in $(seq 40); do NEW="$(pgrep -f /Applications/Toolbox.app/Contents/MacOS/Toolbox | head -1)"; [ -n "$NEW" ] && [ "$NEW" != "$OLD" ] && break; sleep 0.5; done
          [ -n "$NEW" ] && [ "$NEW" != "$OLD" ] || { echo "the new app is not the one running"; exit 1; }
          [ "$(pgrep -f /Applications/Toolbox.app/Contents/MacOS/Toolbox | wc -l | tr -d ' ')" = 1 ] || { echo "more than one running"; exit 1; }
          codesign --verify --deep --strict /Applications/Toolbox.app
          osascript -e 'tell application "Toolbox" to quit' || true
      # Under a virtual display on Linux; one big enough for the 1280 x 900 window.
      - name: The desktop app itself
        run: |
          run() { if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a -s "-screen 0 1600x1200x24" "$@"; else "$@"; fi; }
          cd apps/toolbox/desktop && run npx playwright test
      # Windows: the time zone the tests use can't be set for one program there; macOS and Linux
      # cover the toolbox in the app.
      - name: The toolbox's end-to-end tests, in the app
        if: runner.os != 'Windows'
        run: |
          run() { if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a -s "-screen 0 1600x1200x24" "$@"; else "$@"; fi; }
          cd apps/toolbox && run npx playwright test -c playwright.desktop.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-${{ matrix.name }}
          path: |
            apps/toolbox/desktop/release/*.dmg
            apps/toolbox/desktop/release/*.exe
            apps/toolbox/desktop/release/*.AppImage
            apps/toolbox/desktop/release/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-results-${{ matrix.name }}
          path: |
            apps/toolbox/test-results
            apps/toolbox/desktop/test-results

  # Every check passed on every system: installed apps (build.sh, macOS) may update to this commit.
  stable:
    needs: [check, desktop]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark as stable
        run: |
          git fetch --quiet origin toolbox-stable || true
          if git merge-base --is-ancestor FETCH_HEAD HEAD 2>/dev/null || ! git rev-parse -q --verify FETCH_HEAD >/dev/null; then
            # GitHub now and then answers a push with a server error: tried again, waiting longer each time.
            for wait in 2 4 8 16 0; do
              git push origin HEAD:refs/heads/toolbox-stable && exit 0
              [ "$wait" = 0 ] && exit 1
              sleep "$wait"
            done
          else
            echo "toolbox-stable is ahead (a newer run); left as it is"
          fi
