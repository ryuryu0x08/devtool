# 接口中继 (apps/relay): tests on Linux (the core, the commands, the window, the built app), and
# installers for macOS, Windows and Linux, attached to the run.
name: relay
on:
  push:
    paths: ['apps/relay/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/relay.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/relay
      - name: Libraries the app builds against
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb dbus
      - run: npm ci
      - run: npm run typecheck -w @devtool/relay
      - run: npm run build:web -w @devtool/relay
      - name: Format and lint
        working-directory: apps/relay
        run: cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings
      - name: The core and the commands
        working-directory: apps/relay
        run: cargo test --workspace
      - run: npx playwright install --with-deps chromium
        working-directory: apps/relay
      - name: The window
        run: npm run test:e2e -w @devtool/relay
      - name: The built app, end to end
        run: |
          npm run build -w @devtool/relay -- --bundles deb
          apps/relay/ci/app_e2e.sh apps/relay/target/release/relay-app

  installers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/relay
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      # The core and the commands on this system too (paths, permissions, the app's page origin).
      # On Windows only the core: a test program of the app doesn't start there (it lacks the
      # system manifest Tauri attaches to the app itself); the commands are tested on the others.
      - name: Tests on this system
        working-directory: apps/relay
        shell: bash
        run: |
          npm run build:web
          if [[ "$RUNNER_OS" == Windows ]]; then cargo test -p relay-core; else cargo test --workspace; fi
      # As on a Mac: build.sh --install builds, installs and opens it; the relay answers. Again over
      # the running one: that one quits, the new one serves, only one runs.
      - name: The build script (macOS)
        if: runner.os == 'macOS'
        run: |
          answers() {
            for _ in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:8790/ && break; sleep 0.5; done
            [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8790/v1/messages)" = 401 ] || { echo "the installed app's relay does not answer"; exit 1; }
          }
          apps/relay/build.sh --install
          answers
          OLD="$(pgrep -f /Applications/Relay.app/ | head -1)"
          apps/relay/build.sh --install
          answers
          NEW="$(pgrep -f /Applications/Relay.app/ | head -1)"
          [ "$OLD" != "$NEW" ] || { echo "the running app was not replaced"; exit 1; }
          [ "$(pgrep -f /Applications/Relay.app/ | wc -l | tr -d ' ')" = 1 ] || { echo "more than one is running"; exit 1; }
          echo "OK: build.sh --install, twice"
          osascript -e 'tell application "Relay" to quit' || pkill -f /Applications/Relay.app/
      - run: npm run build -w @devtool/relay
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.name }}
          path: |
            apps/relay/target/release/bundle/dmg/*.dmg
            apps/relay/target/release/bundle/msi/*.msi
            apps/relay/target/release/bundle/nsis/*.exe
            apps/relay/target/release/bundle/deb/*.deb
            apps/relay/target/release/bundle/rpm/*.rpm
            apps/relay/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
