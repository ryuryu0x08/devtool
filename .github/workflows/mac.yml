# Builds and tests the macOS app (mac/QuotaBar) on a Mac. The built app is attached to the run.
name: mac
on:
  push:
    paths: ['mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mac/QuotaBar
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: ./build.sh
      - name: Can Core Text read .woff2?
        run: |
          curl -sSL https://registry.npmjs.org/@fontsource-variable/inter/-/inter-5.1.0.tgz | tar xz -C "$RUNNER_TEMP"
          swift ../ci/fontcheck.swift "$RUNNER_TEMP"/package/files/inter-latin-wght-normal.woff2 "$RUNNER_TEMP"/package/files/inter-latin-wght-normal.woff2
      # A look at the app against a stand-in usage API: the dashboard, light and dark.
      - name: Screenshots
        timeout-minutes: 8
        run: ../ci/screenshots.sh
      - run: ditto -c -k --keepParent build/QuotaBar.app build/QuotaBar.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaBar
          path: mac/QuotaBar/build/QuotaBar.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: mac/QuotaBar/build/shots
