# Builds and tests QuotaBar (apps/quotabar) on a Mac. The built app is attached to the run.
name: quotabar
on:
  push:
    paths: ['apps/quotabar/**', '.github/workflows/quotabar.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    # To move quotabar-stable, the branch the app's update check follows.
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/quotabar
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history: pushing quotabar-stable forward needs the commit it is on now.
          fetch-depth: 0
      - run: swift --version
      - run: swift test
      - name: Can Core Text read .woff2?
        run: |
          curl -sSL https://registry.npmjs.org/@fontsource-variable/inter/-/inter-5.1.0.tgz | tar xz -C "$RUNNER_TEMP"
          swift ci/fontcheck.swift "$RUNNER_TEMP"/package/files/inter-latin-wght-normal.woff2 "$RUNNER_TEMP"/package/files/inter-latin-wght-normal.woff2
      - name: Build, with a font
        run: |
          mkdir -p "$RUNNER_TEMP/fonts"
          cp "$RUNNER_TEMP"/package/files/inter-latin-wght-normal.woff2 "$RUNNER_TEMP/fonts/"
          ./build.sh --fonts "$RUNNER_TEMP/fonts"
          test -f build/QuotaBar.app/Contents/Resources/Fonts/inter-latin-wght-normal.woff2 || { echo "the font is not in the app"; exit 1; }
      # A look at the app against a stand-in usage API: the dashboard, light and dark.
      - name: Local forwarder, end to end
        timeout-minutes: 5
        run: ci/forward_e2e.sh
      - name: Screenshots
        timeout-minutes: 8
        run: ci/screenshots.sh
      - run: ditto -c -k --keepParent build/QuotaBar.app build/QuotaBar.zip
      # Built and tested: the app's update check may install this version now.
      - name: Mark as stable
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --quiet origin quotabar-stable || true
          if git merge-base --is-ancestor FETCH_HEAD HEAD 2>/dev/null || ! git rev-parse -q --verify FETCH_HEAD >/dev/null; then
            # GitHub now and then answers a push with a server error: tried again, waiting longer each time.
            for wait in 2 4 8 16 0; do
              git push origin HEAD:refs/heads/quotabar-stable && exit 0
              [ "$wait" = 0 ] && exit 1
              sleep "$wait"
            done
          else
            echo "quotabar-stable is ahead (a newer run); left as it is"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaBar
          path: apps/quotabar/build/QuotaBar.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: apps/quotabar/build/shots
